<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerShell Practice List</title>
</head>
<body>
  <main>
    <h1>My PowerShell Practice List</h1>

    <label for="commandInput">PowerShell command</label>
    <input
      id="commandInput"
      type="text"
      placeholder="Example: Get-ChildItem"
    >

    <button id="addButton" type="button">Add command</button>

    <p id="message" aria-live="polite"></p>

    <h2>Commands to practice</h2>
    <ul id="commandList"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
